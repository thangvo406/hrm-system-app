name: Android Beta Build (Firebase)

on:
  push:
    branches:
      - dev
  # Cho phép chạy lại riêng Android từ tab Actions mà không kéo theo iOS.
  workflow_dispatch:

env:
  # Tiền tố tên file APK, chỉ Android dùng (lane iOS tự hardcode "CoopUse_DEV_v").
  PREFIX_APP_NAME: 'COOP_DEV_v'

  # github.ref_name: tên nhánh đang trigger workflow.
  BRANCH_NAME: ${{ github.ref_name }}

  # Lấy từ GitHub Variables (Settings > Secrets and variables > Variables) để đổi
  # version không cần sửa code. Chưa cấu hình thì fallback '1.0.0'.
  VERSION_NUMBER: ${{ vars.VERSION_NUMBER || '1.0.0' }}

# versionCode lấy từ get_firebase_latest_version_code + 1, tức phụ thuộc trạng thái
# Firebase tại thời điểm chạy. Hai run song song sẽ đọc ra cùng một số và tạo hai
# bản trùng versionCode — nên phải xếp hàng.
# cancel-in-progress: false: huỷ giữa chừng có thể vứt bỏ một bản đã build xong
# hoặc đang upload dở lên Firebase.
#
# Group có hậu tố -android để không xếp hàng chung với workflow iOS.
concurrency:
  group: beta-build-android-${{ github.ref }}

jobs:
  build-android:
    name: Build Android Beta
    # Ghim số phiên bản chứ không dùng macos-latest: GitHub tự đổi con trỏ đó,
    # build đang xanh có thể đỏ mà không commit nào thay đổi. Đổi lại là phải tự
    # theo mốc deprecate ở actions/runner-images — image cũ bị rút capacity dần
    # nên job nằm Queued vô thời hạn, không báo lỗi gì (macos-14 đã bị vậy).
    runs-on: macos-26
    # QUAN TRỌNG: Cấp quyền để GitHub Actions tạo được Release và lưu file APK
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          # Cần full history: release note Firebase lấy từ `git log`.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'

      - name: Enable Corepack (Yarn 3.6)
        run: |
          corepack enable
          corepack prepare yarn@3.6.4 --activate
          yarn --version

      - name: Cache Yarn dependencies
        uses: actions/cache@v4
        with:
          path: .yarn/cache
          key: yarn-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
          restore-keys: yarn-${{ runner.os }}-

      - name: Install Dependencies
        run: yarn install --no-immutable

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          # cache: 'gradle'
      # (Cấp độ 2 & 3: Thêm Action này để quản lý toàn bộ Cache của Android)
      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3
        with:
          # Chỉ ghi đè cache mới khi build trên nhánh chính để tránh rác cache
          cache-read-only: ${{ github.ref != 'refs/heads/dev' }}

      - name: Setup Ruby and Fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
          working-directory: android

      - name: Decode & Generate Google Services and Firebase Credentials
        run: |
          # 1. Giải mã google-services.json và đặt đúng thư mục app/
          # echo "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" | base64 --decode > android/app/google-services.json

          # 2. Giải mã file credential để Fastlane upload (đặt tạm ở thư mục android/)
          echo "${{ secrets.FIREBASE_CREDENTIALS_DEV_BASE64 }}" | base64 --decode > android/coop-dev-firebase.json

          # In ra thông báo check xem file đã tồn tại chưa
          # ls -la android/app/google-services.json
          ls -la android/coop-dev-firebase.json

      - name: Run Fastlane Android Beta
        # Không cần truyền tham số ở đây nữa, Fastlane sẽ tự đọc từ biến môi trường
        run: bundle exec fastlane beta
        working-directory: android
        env:
          GITHUB_TOKEN: ${{ secrets.CUSTOM_GITHUB_TOKEN }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
