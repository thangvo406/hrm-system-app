name: Android Release Build (AAB)

on:
  push:
    branches:
      - master
  # Cho phép chạy lại riêng Android từ tab Actions mà không kéo theo iOS.
  workflow_dispatch:

env:
  # Tiền tố tên file AAB, chỉ Android dùng (lane iOS tự hardcode "CoopUse_PRD_v").
  PREFIX_APP_NAME: 'COOP_PROD'

  # github.ref_name: tên nhánh đang trigger workflow.
  BRANCH_NAME: ${{ github.ref_name }}

  # Lấy từ GitHub Variables (Settings > Secrets and variables > Variables) để đổi
  # version không cần sửa code. Chưa cấu hình thì fallback '1.0.0'.
  VERSION_NUMBER: ${{ vars.VERSION_NUMBER || '1.0.0' }}

  # react-native-config đọc biến này khi gradle build → chọn config production.
  # Lane iOS không cần vì tự gọi select_env_file("env/.prod").
  ENVFILE: env/.prod

# versionCode lấy từ get_firebase_latest_version_code + 1, tức phụ thuộc trạng thái
# Firebase tại thời điểm chạy. Hai run song song sẽ đọc ra cùng một số và tạo hai
# bản trùng versionCode — nên phải xếp hàng.
# cancel-in-progress: false: huỷ giữa chừng có thể vứt bỏ một bản đã build xong.
concurrency:
  group: release-build-android-${{ github.ref }}

jobs:
  build-android:
    name: Build Android Release AAB
    # Xem beta-build-android.yml: ghim số phiên bản, không dùng macos-latest.
    runs-on: macos-26
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          # Cần full history: release note Firebase lấy từ `git log`.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'

      - name: Enable Corepack (Yarn 3.6)
        run: |
          corepack enable
          corepack prepare yarn@3.6.4 --activate
          yarn --version

      - name: Cache Yarn dependencies
        uses: actions/cache@v4
        with:
          path: .yarn/cache
          key: yarn-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
          restore-keys: yarn-${{ runner.os }}-

      - name: Install Dependencies
        run: yarn install --no-immutable

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3
        with:
          # Chỉ ghi đè cache mới khi build trên nhánh chính để tránh rác cache
          cache-read-only: ${{ github.ref != 'refs/heads/master' }}

      - name: Setup Ruby and Fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
          working-directory: android

      - name: Decode & Generate Firebase Credentials
        env:
          CREDS_B64: ${{ secrets.FIREBASE_CREDENTIALS_PROD_BASE64 }}
        run: |
          # Kiểm tra secret có tồn tại không (in độ dài, không lộ giá trị)
          echo "Độ dài secret: ${#CREDS_B64} ký tự"
          if [ -z "$CREDS_B64" ]; then
            echo "::error::Secret FIREBASE_CREDENTIALS_PROD_BASE64 rỗng hoặc sai tên (Settings → Secrets and variables → Actions → Repository secrets)"
            exit 1
          fi

          # Giải mã file credential production để Fastlane upload lên Firebase App Distribution
          printf '%s' "$CREDS_B64" | base64 --decode > android/coop-prod-firebase.json

          ls -la android/coop-prod-firebase.json

      - name: Run Fastlane Android Release AAB
        id: aab
        # Fastlane tự đọc VERSION_NUMBER / PREFIX_APP_NAME / BRANCH_NAME từ biến môi trường
        run: bundle exec fastlane release_aab
        working-directory: android
        env:
          GITHUB_TOKEN: ${{ secrets.CUSTOM_GITHUB_TOKEN }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Upload AAB artifact
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.aab.outputs.aab_name }}
          path: ${{ steps.aab.outputs.aab_path }}
          if-no-files-found: error
          retention-days: 14

      - name: Build summary
        run: |
          # Không in BUILD_NUMBER: versionCode thật do Firebase quyết định
          # (get_firebase_latest_version_code + 1), không phải github.run_number.
          # Số đó đã nằm trong tên artifact dạng <prefix>_v<version>_b<versionCode>.
          {
            echo "## 🤖 Android AAB Release"
            echo ""
            echo "- **Version**: ${VERSION_NUMBER}"
            echo "- **Artifact**: ${{ steps.aab.outputs.aab_name }} (id: ${{ steps.upload.outputs.artifact-id }})"
            echo ""
            echo "Tải về bằng: \`gh run download ${{ github.run_id }} -n ${{ steps.aab.outputs.aab_name }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
