name: React Native CI/CD Beta Build

on:
  push:
    branches:
      - dev

# Thiết lập biến môi trường toàn cục cho toàn bộ workflow
env:
  # github.run_number: Tự động tăng mỗi khi workflow chạy (ví dụ: 1, 2, 3...)
  # Hoặc bạn có thể hardcode là '8929' nếu muốn.
  BUILD_NUMBER: ${{ github.run_number }}

  PREFIX_APP_NAME: 'COOP_DEV_v'

  # github.ref_name: Tự động lấy tên nhánh đang trigger workflow (ở đây là master_icourse)
  BRANCH_NAME: ${{ github.ref_name }}

  # Lấy từ GitHub Variables (Settings > Secrets and variables > Variables) để dễ đổi version sau này mà không cần sửa code.
  # Nếu chưa cấu hình variable thì fallback về '1.0.0'.
  VERSION_NUMBER: ${{ vars.VERSION_NUMBER || '1.0.0' }}

jobs:
  build-android:
    name: Build Android Beta
    runs-on: macos-14
    # QUAN TRỌNG: Cấp quyền để GitHub Actions tạo được Release và lưu file APK
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'

      - name: Enable Corepack (Yarn 3.6)
        run: |
          corepack enable
          corepack prepare yarn@3.6.4 --activate
          yarn --version

      - name: Cache Yarn dependencies
        uses: actions/cache@v4
        with:
          path: .yarn/cache
          key: yarn-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
          restore-keys: yarn-${{ runner.os }}-

      - name: Install Dependencies
        run: yarn install --no-immutable

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          # cache: 'gradle'
      # (Cấp độ 2 & 3: Thêm Action này để quản lý toàn bộ Cache của Android)
      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3
        with:
          # Chỉ ghi đè cache mới khi build trên nhánh chính để tránh rác cache
          cache-read-only: ${{ github.ref != 'refs/heads/dev' }}

      - name: Setup Ruby and Fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
          working-directory: android

      - name: Decode & Generate Google Services and Firebase Credentials
        run: |
          # 1. Giải mã google-services.json và đặt đúng thư mục app/
          # echo "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" | base64 --decode > android/app/google-services.json

          # 2. Giải mã file credential để Fastlane upload (đặt tạm ở thư mục android/)
          echo "${{ secrets.FIREBASE_CREDENTIALS_DEV_BASE64 }}" | base64 --decode > android/coop-dev-firebase.json

          # In ra thông báo check xem file đã tồn tại chưa
          # ls -la android/app/google-services.json
          ls -la android/coop-dev-firebase.json

      - name: Run Fastlane Android Beta
        # Không cần truyền tham số ở đây nữa, Fastlane sẽ tự đọc từ biến môi trường
        run: bundle exec fastlane beta
        working-directory: android
        env:
          GITHUB_TOKEN: ${{ secrets.CUSTOM_GITHUB_TOKEN }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

  build-ios:
    name: Build iOS Beta (TestFlight)
    runs-on: macos-15
    # Build + archive + upload TestFlight thường ~40-60 phút, cho dư biên.
    timeout-minutes: 90

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select Xcode
        # Từ Xcode 16, iOS platform là gói tải riêng — runner image có thể có
        # /Applications/Xcode_X.Y.app mà KHÔNG có iOS platform, và archive sẽ
        # chết với "Unable to find a destination matching { generic, platform:iOS }".
        # Nên phải chọn theo tiêu chí "có iphoneos SDK", không phải theo tên thư mục.
        #
        # Ưu tiên major 26 để CI khớp với máy dev (đang dùng Xcode 26.x) — chênh
        # Xcode giữa local và CI là nguồn của cả một lớp lỗi "local pass, CI fail".
        # Đổi XCODE_MAJOR_PREF về '16' là quay lại SDK iOS 18.x.
        env:
          XCODE_MAJOR_PREF: '26'
        run: |
          set -uo pipefail
          echo "Xcode có trên runner:"
          ls -d /Applications/Xcode*.app 2>/dev/null || true

          # Ưu tiên major đã chọn (mới nhất trong nhóm), rồi tới bản mới nhất
          # bất kỳ nếu nhóm đó không dùng được; bỏ trùng lặp.
          candidates=$(
            { ls -d "/Applications/Xcode_${XCODE_MAJOR_PREF}"*.app 2>/dev/null | sort -Vr
              ls -d /Applications/Xcode*.app                       2>/dev/null | sort -Vr
            } | awk '!seen[$0]++'
          )

          # Hứng output ra biến rồi mới so khớp — KHÔNG dùng `| grep -q`: grep thoát
          # ngay khi khớp dòng đầu, xcodebuild nhận SIGPIPE và trả non-zero, rồi
          # `pipefail` biến cả pipeline thành thất bại dù thực ra đã khớp.
          pick=""
          for app in $candidates; do
            sdks=$(DEVELOPER_DIR="$app/Contents/Developer" xcodebuild -showsdks 2>/dev/null || true)
            case "$sdks" in
              *iphoneos*)
                pick="$app"
                break
                ;;
            esac
            echo "  bỏ qua $app — chưa cài iOS platform"
          done

          if [ -z "$pick" ]; then
            echo "::error::Không có Xcode nào trên runner cài sẵn iOS platform"
            exit 1
          fi

          sudo xcode-select -s "$pick"
          echo "Đã chọn: $pick"
          xcodebuild -version
          xcodebuild -showsdks | grep -i 'ios' || true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'

      - name: Enable Corepack (Yarn 3.6)
        run: |
          corepack enable
          corepack prepare yarn@3.6.4 --activate
          yarn --version

      - name: Cache Yarn dependencies
        uses: actions/cache@v4
        with:
          path: .yarn/cache
          key: yarn-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
          restore-keys: yarn-${{ runner.os }}-

      - name: Install Dependencies
        run: yarn install --no-immutable

      - name: Setup Ruby and Fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
          working-directory: ios

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: |
            ios/Pods
            ~/Library/Caches/CocoaPods
          # Podfile.lock/yarn.lock đều bị gitignore (`*.lock`) nên key phải dựa
          # trên các file thực sự có trong repo và quyết định native deps.
          key: pods-${{ runner.os }}-${{ hashFiles('ios/Podfile', 'package.json') }}
          restore-keys: pods-${{ runner.os }}-

      - name: Run Fastlane iOS Beta
        id: ipa
        # Fastlane tự đọc VERSION_NUMBER / BUILD_NUMBER / BRANCH_NAME từ env,
        # và tự ghi AuthKey .p8 ra ios/ từ APP_STORE_CONNECT_API_KEY_BASE64.
        run: bundle exec fastlane beta
        working-directory: ios
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          IOS_DIST_CERT_P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          FASTLANE_XCODEBUILD_SETTINGS_TIMEOUT: '120'
          FASTLANE_XCODEBUILD_SETTINGS_RETRIES: '10'

      - name: Upload IPA artifact
        id: upload
        # Fastlane build IPA xong mới upload TestFlight. Nếu bước pilot lỗi,
        # IPA vẫn nằm sẵn trên disk — giữ lại thay vì bỏ luôn cả bản build.
        if: always() && steps.ipa.outputs.ipa_path != ''
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.ipa.outputs.ipa_name }}
          path: ${{ steps.ipa.outputs.ipa_path }}
          if-no-files-found: error
          retention-days: 14

      - name: Build summary
        if: always()
        run: |
          {
            echo "## 🍏 iOS Beta (TestFlight)"
            echo ""
            echo "- **Version**: ${VERSION_NUMBER} (build ${BUILD_NUMBER})"
            echo "- **Artifact**: ${{ steps.ipa.outputs.ipa_name }} (id: ${{ steps.upload.outputs.artifact-id }})"
            echo ""
            echo "Tải về bằng: \`gh run download ${{ github.run_id }} -n ${{ steps.ipa.outputs.ipa_name }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
