name: React Native CI/CD Beta Build

on:
  push:
    branches:
      - dev

# Thiết lập biến môi trường toàn cục cho toàn bộ workflow
env:
  # github.run_number: Tự động tăng mỗi khi workflow chạy (ví dụ: 1, 2, 3...)
  # Hoặc bạn có thể hardcode là '8929' nếu muốn.
  BUILD_NUMBER: ${{ github.run_number }}

  PREFIX_APP_NAME: 'COOP_DEV_v'

  # github.ref_name: Tự động lấy tên nhánh đang trigger workflow (ở đây là master_icourse)
  BRANCH_NAME: ${{ github.ref_name }}

  # Lấy từ GitHub Variables (Settings > Secrets and variables > Variables) để dễ đổi version sau này mà không cần sửa code.
  # Nếu chưa cấu hình, bạn có thể hardcode thẳng: '1.0.31'
  VERSION_NUMBER: '1.0.0'

jobs:
  build-android:
    name: Build Android Beta
    runs-on: macos-14
    # QUAN TRỌNG: Cấp quyền để GitHub Actions tạo được Release và lưu file APK
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: 'yarn'

      - name: Install Dependencies
        run: yarn install

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          # cache: 'gradle'
      # (Cấp độ 2 & 3: Thêm Action này để quản lý toàn bộ Cache của Android)
      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3
        with:
          # Chỉ ghi đè cache mới khi build trên nhánh chính để tránh rác cache
          cache-read-only: ${{ github.ref != 'refs/heads/dev' }}

      - name: Setup Ruby and Fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
          working-directory: android

      - name: Decode & Generate Google Services and Firebase Credentials
        run: |
          # 1. Giải mã google-services.json và đặt đúng thư mục app/
          # echo "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" | base64 --decode > android/app/google-services.json

          # 2. Giải mã file credential để Fastlane upload (đặt tạm ở thư mục android/)
          echo "${{ secrets.FIREBASE_CREDENTIALS_DEV_BASE64 }}" | base64 --decode > android/coop-dev-firebase.json

          # In ra thông báo check xem file đã tồn tại chưa
          # ls -la android/app/google-services.json
          ls -la android/coop-dev-firebase.json

      - name: Run Fastlane Android Beta
        # Không cần truyền tham số ở đây nữa, Fastlane sẽ tự đọc từ biến môi trường
        run: bundle exec fastlane beta
        working-directory: android
        env:
          GITHUB_TOKEN: ${{ secrets.CUSTOM_GITHUB_TOKEN }}

