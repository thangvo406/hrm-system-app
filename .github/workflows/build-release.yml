name: React Native Release Build

on:
  push:
    branches:
      - master

# Thiết lập biến môi trường toàn cục cho toàn bộ workflow
env:
  # github.run_number: Tự động tăng mỗi khi workflow chạy (ví dụ: 1, 2, 3...)
  BUILD_NUMBER: ${{ github.run_number }}

  PREFIX_APP_NAME: 'COOP_PROD'

  # github.ref_name: Tự động lấy tên nhánh đang trigger workflow (ở đây là master)
  BRANCH_NAME: ${{ github.ref_name }}

  # Lấy từ GitHub Variables (Settings > Secrets and variables > Actions > Variables)
  # để đổi version không cần sửa code. Chưa set variable thì fallback về '1.0.0'.
  VERSION_NUMBER: ${{ vars.VERSION_NUMBER || '1.0.0' }}

  # Build release dùng config production
  ENVFILE: env/.prod

jobs:
  build-android:
    name: Build Android Release AAB
    runs-on: macos-14
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'

      - name: Enable Corepack (Yarn 3.6)
        run: |
          corepack enable
          corepack prepare yarn@3.6.4 --activate
          yarn --version

      - name: Cache Yarn dependencies
        uses: actions/cache@v4
        with:
          path: .yarn/cache
          key: yarn-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
          restore-keys: yarn-${{ runner.os }}-

      - name: Install Dependencies
        run: yarn install --no-immutable

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3
        with:
          # Chỉ ghi đè cache mới khi build trên nhánh chính để tránh rác cache
          cache-read-only: ${{ github.ref != 'refs/heads/master' }}

      - name: Setup Ruby and Fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
          working-directory: android

      - name: Decode & Generate Firebase Credentials
        env:
          CREDS_B64: ${{ secrets.FIREBASE_CREDENTIALS_PROD_BASE64 }}
        run: |
          # Kiểm tra secret có tồn tại không (in độ dài, không lộ giá trị)
          echo "Độ dài secret: ${#CREDS_B64} ký tự"
          if [ -z "$CREDS_B64" ]; then
            echo "::error::Secret FIREBASE_CREDENTIALS_PROD_BASE64 rỗng hoặc sai tên (Settings → Secrets and variables → Actions → Repository secrets)"
            exit 1
          fi

          # Giải mã file credential production để Fastlane upload lên Firebase App Distribution
          printf '%s' "$CREDS_B64" | base64 --decode > android/coop-prod-firebase.json

          ls -la android/coop-prod-firebase.json

      - name: Run Fastlane Android Release AAB
        id: aab
        # Fastlane tự đọc VERSION_NUMBER / BUILD_NUMBER / PREFIX_APP_NAME từ biến môi trường
        run: bundle exec fastlane release_aab
        working-directory: android
        env:
          GITHUB_TOKEN: ${{ secrets.CUSTOM_GITHUB_TOKEN }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Upload AAB artifact
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.aab.outputs.aab_name }}
          path: ${{ steps.aab.outputs.aab_path }}
          if-no-files-found: error
          retention-days: 14

      - name: Build summary
        run: |
          {
            echo "## 🤖 Android AAB Release"
            echo ""
            echo "- **Version**: ${VERSION_NUMBER} (build ${BUILD_NUMBER})"
            echo "- **Artifact**: ${{ steps.aab.outputs.aab_name }} (id: ${{ steps.upload.outputs.artifact-id }})"
            echo ""
            echo "Tải về bằng: \`gh run download ${{ github.run_id }} -n ${{ steps.aab.outputs.aab_name }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

